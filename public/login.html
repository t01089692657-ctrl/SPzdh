<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - AI 视频创作平台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.2v13.6L19 12 8 5.2Zm-5 2.3A4.5 4.5 0 0 1 7.5 3h9A4.5 4.5 0 0 1 21 7.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 3 16.5v-9Z"/></svg>
        </div>
        <h1>AI 视频创作平台</h1>
        <p id="subtitle">公司内部使用，请用你的账号登录</p>
      </div>

      <div class="auth-error" id="error"></div>

      <form id="loginForm">
        <div class="auth-field">
          <label for="username">用户名</label>
          <input id="username" type="text" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="auth-field hidden" id="displayNameField">
          <label for="displayName">姓名 / 昵称（选填）</label>
          <input id="displayName" type="text" autocomplete="nickname" />
        </div>
        <div class="auth-field hidden" id="inviteField">
          <label for="inviteCode">邀请码</label>
          <input id="inviteCode" type="text" autocomplete="off" />
        </div>
        <button class="btn primary full" id="submitBtn" type="submit" style="margin-top:8px;">登 录</button>
      </form>

      <div class="auth-switch hidden" id="switchRow">
        <span id="switchText">还没有账号？</span>
        <button type="button" id="switchBtn">用邀请码注册</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let mode = "login";

    async function checkRegistration() {
      try {
        const response = await fetch("/api/auth/registration");
        const data = await response.json();
        if (data.open) $("switchRow").classList.remove("hidden");
      } catch {}
    }

    function setMode(next) {
      mode = next;
      const isRegister = mode === "register";
      $("displayNameField").classList.toggle("hidden", !isRegister);
      $("inviteField").classList.toggle("hidden", !isRegister);
      $("submitBtn").textContent = isRegister ? "注 册" : "登 录";
      $("switchText").textContent = isRegister ? "已有账号？" : "还没有账号？";
      $("switchBtn").textContent = isRegister ? "返回登录" : "用邀请码注册";
      $("subtitle").textContent = isRegister ? "填写邀请码即可自助开通账号" : "公司内部使用，请用你的账号登录";
      showError("");
    }

    function showError(message) {
      $("error").textContent = message;
      $("error").classList.toggle("show", !!message);
    }

    $("switchBtn")?.addEventListener("click", () => setMode(mode === "login" ? "register" : "login"));

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("submitBtn").disabled = true;
      showError("");
      try {
        const endpoint = mode === "register" ? "/api/auth/register" : "/api/auth/login";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: $("username").value.trim(),
            password: $("password").value,
            displayName: $("displayName").value.trim(),
            inviteCode: $("inviteCode").value.trim()
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "操作失败，请重试。");
        location.href = "/index.html";
      } catch (error) {
        showError(error.message);
      } finally {
        $("submitBtn").disabled = false;
      }
    });

    fetch("/api/auth/me").then((response) => {
      if (response.ok) location.href = "/index.html";
    }).catch(() => {});
    checkRegistration();
  </script>
</body>
</html>
